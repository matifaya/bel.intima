# ==========================================================================
# Panel de administración de Bel Intimma (Sveltia CMS)
# Define qué puede editar la dueña desde https://belintimma.netlify.app/admin/
# y cómo se guarda. Cada "Publicar" del panel es un commit en GitHub, y Netlify
# vuelve a publicar la página sola en 1 o 2 minutos.
# Documentación: https://sveltiacms.app/en/docs
# ==========================================================================

backend:
  name: github
  repo: matifaya/bel.intima
  branch: main
  # Sin base_url: el inicio de sesión usa el OAuth de Netlify (ver README).
  commit_messages:
    create: "Panel: agregar {{collection}} «{{slug}}»"
    update: "Panel: editar {{collection}} «{{slug}}»"
    delete: "Panel: borrar {{collection}} «{{slug}}»"
    uploadMedia: "Panel: subir foto «{{path}}»"
    deleteMedia: "Panel: borrar foto «{{path}}»"

app_title: Panel Bel Intimma
logo:
  src: /img/favicon.svg
site_url: https://belintimma.netlify.app
display_url: https://belintimma.netlify.app
logout_redirect_url: https://belintimma.netlify.app/

# Fotos de productos
media_folder: /img/productos
public_folder: /img/productos

media_libraries:
  default:
    config:
      max_file_size: 30000000 # 30 MB antes de achicarla
      # "Foto (1).JPG" -> "foto-1.webp": la página solo acepta nombres simples
      slugify_filename: true
      transformations:
        # Toda foto se convierte en el navegador ANTES de subirse: pasa a WebP,
        # se achica a 1600 px y pierde los metadatos (ubicación GPS, celular, fecha).
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

# Nombres de archivo: sin tildes ni espacios (también son el link de cada producto)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
  lowercase: true
  maxlength: 50

collections:
  # ------------------------------------------------------------------------
  - name: productos
    label: Productos
    label_singular: Producto
    icon: apparel
    description: >-
      Arrastrá para cambiar el orden en que aparecen en la página.
      Para ocultar uno sin borrarlo, desactivá «Mostrar en la página».
    folder: /datos/productos
    format: json
    extension: json
    create: true
    delete: true
    reorder:
      key: orden
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields: [nombre, precio, categoria]
    view_filters:
      - label: Ocultos
        field: disponible
        pattern: false
    editor:
      preview: false
    fields:
      - name: nombre
        label: Nombre
        widget: string
        maxlength: 80
        hint: "Como se ve en la página. Ej: Conjunto Ámbar"
      - name: categoria
        label: Categoría
        widget: relation
        collection: categorias
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
      - name: precio
        label: Precio
        widget: number
        value_type: int
        min: 1
        hint: "Sin puntos ni signo $. Ej: 18900"
      - name: precioAntes
        label: Precio anterior
        widget: number
        value_type: int
        min: 1
        required: false
        hint: "Opcional. Si está en oferta, poné acá el precio de antes y se ve tachado."
      - name: fotos
        label: Fotos
        widget: image
        multiple: true
        required: false
        # Sin SVG ni GIF: solo fotos (las HEIC del iPhone se convierten a WebP)
        accept: "image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif"
        hint: "La primera es la que se ve en el catálogo. Si no subís ninguna, se muestra un dibujo. Se achican solas y se les borra la ubicación."
      - name: talles
        label: Talles
        label_singular: Talle
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.talle}}{{fields.agotado | ternary(' — sin stock', '')}}"
        hint: "Uno por talle, en orden (Ej: S, M, L o 85, 90, 95). Si se termina uno, activá «Sin stock»: en la página se ve tachado y no se puede elegir. Los productos nuevos empiezan con S a XXL: borrá los que no van."
        default:
          - { talle: S, agotado: false }
          - { talle: M, agotado: false }
          - { talle: L, agotado: false }
          - { talle: XL, agotado: false }
          - { talle: XXL, agotado: false }
        fields:
          - name: talle
            label: Talle
            widget: string
            maxlength: 12
          - name: agotado
            label: Sin stock
            widget: boolean
            default: false
            required: false
      - name: colores
        label: Colores
        label_singular: Color
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.color}}{{fields.agotado | ternary(' — sin stock', '')}}"
        hint: "Uno por color. Si el nombre es un color conocido (rosa, negro, nude, lila…) se muestra la muestrita de color. Cada color tiene su propio stock."
        fields:
          - name: color
            label: Color
            widget: string
            maxlength: 30
          - name: agotado
            label: Sin stock (todo este color)
            widget: boolean
            default: false
            required: false
            hint: "Se ve tachado y no se puede elegir."
          - name: tallesAgotados
            label: Talles sin stock en este color
            widget: select
            multiple: true
            required: false
            dropdown_threshold: 30
            options: [XS, S, M, L, XL, XXL, XXXL, "80", "85", "90", "95", "100", "105", "110", Único]
            hint: "Marcá los talles que NO hay en este color. Los que el producto no tiene no importan. Si la clienta elige este color, esos talles se ven tachados."
      - name: descripcion
        label: Descripción
        widget: text
        required: false
        maxlength: 400
        hint: "Tela, detalles, cómo calza."
      - name: etiqueta
        label: Etiqueta
        widget: string
        required: false
        maxlength: 20
        hint: "Opcional. Ej: Nuevo, Oferta, Últimos. Si dice «Oferta», se ve en fucsia."
      - name: disponible
        label: Mostrar en la página
        widget: boolean
        default: true
        hint: "Desactivalo si no hay stock: el producto queda guardado pero no se ve."

  # ------------------------------------------------------------------------
  - name: categorias
    label: Categorías
    label_singular: Categoría
    icon: category
    description: Arrastrá para cambiar el orden de los botones de categorías.
    folder: /datos/categorias
    format: json
    extension: json
    create: true
    delete: true
    reorder:
      key: orden
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    editor:
      preview: false
    fields:
      - name: nombre
        label: Nombre
        widget: string
        maxlength: 40
        hint: "Ej: Conjuntos sin aro"
      - name: corto
        label: Nombre corto
        widget: string
        maxlength: 20
        hint: "Para el círculo de arriba (como los destacados de Instagram). Ej: Sin aro"
      - name: dibujo
        label: Dibujo
        widget: select
        hint: "El dibujo del círculo y de los productos que no tienen foto."
        options:
          - { label: "Corpiño con aro", value: con-aro }
          - { label: "Bralette sin aro", value: sin-aro }
          - { label: "Pijama", value: pijama }

  # ------------------------------------------------------------------------
  - name: ajustes
    label: Datos de la tienda
    icon: storefront
    editor:
      preview: false
    files:
      - name: tienda
        label: Contacto, pagos y entregas
        file: /datos/tienda.json
        format: json
        fields:
          - name: nombre
            label: Nombre de la tienda
            widget: string
            maxlength: 40
          - name: whatsapp
            label: Número de WhatsApp
            widget: string
            pattern: ['^549\d{8,12}$', 'Formato: 549 + código de área sin 0 + número sin 15. Ej: 5491112345678']
            hint: "Recibe los pedidos. 549 + código de área sin 0 + número sin 15. Ej: 11 1234-5678 → 5491112345678"
          - name: instagram
            label: Usuario de Instagram
            widget: string
            pattern: ['^[A-Za-z0-9._]{1,30}$', 'Solo el usuario, sin @ ni link. Ej: bel.intimma']
          - name: tiktok
            label: Usuario de TikTok
            widget: string
            pattern: ['^[A-Za-z0-9._]{1,30}$', 'Solo el usuario, sin @ ni link. Ej: bel.intimma']
          - name: zona
            label: Zona
            widget: string
            maxlength: 80
            hint: "Se ve al pie de la página. Ej: Gral. San Martín, Buenos Aires"
          - name: avisos
            label: Avisos de la franja de arriba
            widget: list
            max: 6
            required: false
            hint: "Van rotando. Uno por renglón, cortitos."
          - name: descuentoTransferencia
            label: Descuento por transferencia o efectivo (%)
            widget: number
            value_type: int
            min: 0
            max: 90
            default: 0
            hint: "Poné 0 para no mostrar descuento."
          - name: mediosDePago
            label: Medios de pago
            widget: list
            max: 10
            hint: "Aparecen en la página y en el pedido. Uno por renglón."
          - name: entregas
            label: Formas de entrega
            label_singular: Forma de entrega
            widget: list
            min: 1
            max: 5
            summary: "{{fields.nombre}}"
            fields:
              - name: nombre
                label: Nombre
                widget: string
                maxlength: 60
                hint: "Ej: Retiro en Gral. San Martín"
              - name: detalle
                label: Detalle
                widget: string
                required: false
                maxlength: 120
                hint: "Ej: Sin cargo. Coordinamos día y horario."
              - name: pideDireccion
                label: Pedir localidad o barrio a la clienta
                widget: boolean
                default: false

      - name: talles
        label: Guía de talles
        file: /datos/talles.json
        format: json
        fields:
          - name: nota
            label: Texto de ayuda
            widget: text
            required: false
            maxlength: 300
          - name: tablas
            label: Tablas
            label_singular: Tabla
            widget: list
            max: 6
            summary: "{{fields.titulo}}"
            fields:
              - name: titulo
                label: Título de la tabla
                widget: string
                maxlength: 60
                hint: "Ej: Corpiños con aro"
              - name: columnas
                label: Columnas
                widget: list
                max: 6
                hint: "Los títulos de las columnas, SIN contar «Talle» (va siempre primero). Ej: Busto, Cintura, Cadera"
              - name: filas
                label: Talles
                label_singular: Talle
                widget: list
                max: 20
                summary: "{{fields.talle}}"
                fields:
                  - name: talle
                    label: Talle
                    widget: string
                    maxlength: 12
                  - name: medidas
                    label: Medidas
                    widget: list
                    max: 6
                    hint: "Una por columna y en el mismo orden. Ej: 82–88 cm"

      - name: preguntas
        label: Preguntas frecuentes
        file: /datos/preguntas.json
        format: json
        fields:
          - name: preguntas
            label: Preguntas
            label_singular: Pregunta
            widget: list
            max: 20
            summary: "{{fields.pregunta}}"
            fields:
              - name: pregunta
                label: Pregunta
                widget: string
                maxlength: 120
              - name: respuesta
                label: Respuesta
                widget: text
                maxlength: 600

  # ------------------------------------------------------------------------
  # Todos los textos de la página. Se generó a partir de la lista de textos;
  # si agregás uno acá, agregalo también en datos/textos/ y usalo en index.html
  # ({{seccion.clave}}) o en js/app.js (tx("seccion.clave")).
  - name: textos
    label: Textos de la página
    label_singular: Textos
    icon: edit_note
    description: >-
      Todos los textos de la página, por sección. Las palabras entre llaves, como
      {producto} o {n}, se reemplazan solas por el dato que corresponde: dejalas tal cual.
    editor:
      preview: false
    files:
      - name: inicio
        label: "Inicio (arriba de todo)"
        file: /datos/textos/inicio.json
        format: json
        fields:
          - name: titulo
            label: "Título grande"
            widget: string
            maxlength: 160
            hint: "La primera parte que se ve al entrar."
          - name: bajada
            label: "Texto debajo del título"
            widget: text
            maxlength: 300
          - name: botonCatalogo
            label: "Botón principal"
            widget: string
            maxlength: 160
            hint: "Lleva al catálogo."
          - name: botonComoComprar
            label: "Botón secundario"
            widget: string
            maxlength: 160
            hint: "Lleva a «Cómo comprar»."
      - name: encabezado
        label: "Encabezado y menú"
        file: /datos/textos/encabezado.json
        format: json
        fields:
          - name: logo
            label: "Logo (texto)"
            widget: string
            maxlength: 160
            hint: "La barra de arriba (con el logo y «Tu pedido») y el menú del celular."
          - name: linkCatalogo
            label: "Link «Catálogo» (compu)"
            widget: string
            maxlength: 160
          - name: linkComoComprar
            label: "Link «Cómo comprar» (compu)"
            widget: string
            maxlength: 160
          - name: linkTalles
            label: "Link «Talles» (compu)"
            widget: string
            maxlength: 160
          - name: linkPreguntas
            label: "Link «Preguntas» (compu)"
            widget: string
            maxlength: 160
          - name: botonPedido
            label: "Botón del pedido"
            widget: string
            maxlength: 160
            hint: "Al lado de la bolsita."
          - name: menuCatalogo
            label: "Menú del celular: catálogo"
            widget: string
            maxlength: 160
          - name: menuComoComprar
            label: "Menú del celular: cómo comprar"
            widget: string
            maxlength: 160
          - name: menuTalles
            label: "Menú del celular: talles"
            widget: string
            maxlength: 160
          - name: menuPagos
            label: "Menú del celular: pagos"
            widget: string
            maxlength: 160
          - name: menuPreguntas
            label: "Menú del celular: preguntas"
            widget: string
            maxlength: 160
          - name: menuWhatsapp
            label: "Menú del celular: botón de WhatsApp"
            widget: string
            maxlength: 160
      - name: catalogo
        label: "Catálogo"
        file: /datos/textos/catalogo.json
        format: json
        fields:
          - name: circuloTalles
            label: "Círculo «Talles»"
            widget: string
            maxlength: 160
            hint: "Los círculos de arriba, los filtros y las tarjetas de productos.\\nLos círculos de categorías salen de «Categorías». Estos son los tres de información."
          - name: circuloPagos
            label: "Círculo «Pagos»"
            widget: string
            maxlength: 160
          - name: circuloPreguntas
            label: "Círculo «Preguntas»"
            widget: string
            maxlength: 160
          - name: titulo
            label: "Título"
            widget: string
            maxlength: 160
          - name: filtroTodo
            label: "Filtro para ver todo"
            widget: string
            maxlength: 160
          - name: cantidadUno
            label: "Cantidad (uno)"
            widget: string
            maxlength: 160
            hint: "{n} es el número."
          - name: cantidadVarios
            label: "Cantidad (varios)"
            widget: string
            maxlength: 160
            hint: "{n} es el número."
          - name: rangoTalles
            label: "Talles en la tarjeta"
            widget: string
            maxlength: 160
            hint: "Ej: «S al XL». {desde} y {hasta} son el primer y el último talle."
          - name: precioNota
            label: "Aclaración al lado del precio"
            widget: string
            maxlength: 160
            hint: "Texto chiquito al lado del precio de lista. Solo se ve si hay descuento por transferencia (Datos de la tienda)."
          - name: precioTransferencia
            label: "Precio con transferencia"
            widget: string
            maxlength: 160
            hint: "Solo se ve si hay descuento. {precio} es el precio con descuento."
          - name: vacio
            label: "Categoría sin productos"
            widget: text
            maxlength: 300
      - name: ficha
        label: "Ficha de producto"
        file: /datos/textos/ficha.json
        format: json
        fields:
          - name: talle
            label: "Título «Talle»"
            widget: string
            maxlength: 160
            hint: "Lo que se ve al tocar un producto."
          - name: linkGuia
            label: "Link a la guía de talles"
            widget: string
            maxlength: 160
          - name: color
            label: "Título «Color»"
            widget: string
            maxlength: 160
          - name: errorTalle
            label: "Aviso si no eligió talle"
            widget: string
            maxlength: 160
          - name: talleSinStock
            label: "Talle o color sin stock (lectores de pantalla)"
            widget: string
            maxlength: 160
            hint: "No se ve: los lectores de pantalla lo leen después del talle o color tachado (ej: «M, sin stock»)."
          - name: sinStock
            label: "Aviso si no queda stock"
            widget: string
            maxlength: 160
            hint: "Reemplaza al botón «Agregar al pedido» cuando no queda ninguna combinación de talle y color con stock."
          - name: errorColor
            label: "Aviso si no eligió color"
            widget: string
            maxlength: 160
          - name: agregar
            label: "Botón para agregar"
            widget: string
            maxlength: 160
          - name: agregado
            label: "Aviso al agregar"
            widget: string
            maxlength: 160
            hint: "{producto} es el nombre, con el talle y el color."
          - name: verPedido
            label: "Botón del aviso"
            widget: string
            maxlength: 160
          - name: compartir
            label: "Botón compartir"
            widget: string
            maxlength: 160
          - name: compartirTexto
            label: "Texto al compartir"
            widget: string
            maxlength: 160
            hint: "Lo que acompaña al link cuando la clienta comparte."
          - name: linkCopiado
            label: "Aviso de link copiado"
            widget: string
            maxlength: 160
          - name: consultar
            label: "Link de consulta"
            widget: string
            maxlength: 160
      - name: pasos
        label: "Cómo comprar"
        file: /datos/textos/pasos.json
        format: json
        fields:
          - name: titulo
            label: "Título"
            widget: string
            maxlength: 160
            hint: "La franja rosa con los pasos numerados."
          - name: lista
            label: "Pasos"
            label_singular: Paso
            widget: list
            min: 1
            max: 8
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string, maxlength: 60 }
              - { name: texto, label: Texto, widget: text, maxlength: 300 }
            hint: "Se numeran solos, en este orden."
      - name: info
        label: "Talles, pagos y entregas"
        file: /datos/textos/info.json
        format: json
        fields:
          - name: tallesTitulo
            label: "Título de la guía de talles"
            widget: string
            maxlength: 160
            hint: "Los títulos de esas secciones. Las tablas, los medios de pago y las entregas se cargan en «Datos de la tienda»."
          - name: columnaTalle
            label: "Primera columna de las tablas"
            widget: string
            maxlength: 160
          - name: pagosTitulo
            label: "Título de pagos y entregas"
            widget: string
            maxlength: 160
          - name: mediosTitulo
            label: "Subtítulo de medios de pago"
            widget: string
            maxlength: 160
          - name: notaDescuento
            label: "Aviso del descuento"
            widget: string
            maxlength: 160
            hint: "Solo se ve si hay descuento. {descuento} es el número."
          - name: entregasTitulo
            label: "Subtítulo de entregas"
            widget: string
            maxlength: 160
          - name: preguntasTitulo
            label: "Título de preguntas frecuentes"
            widget: string
            maxlength: 160
      - name: redes
        label: "Redes y pie de página"
        file: /datos/textos/redes.json
        format: json
        fields:
          - name: titulo
            label: "Título de la franja"
            widget: string
            maxlength: 160
            hint: "La franja de Instagram y TikTok y el final de la página."
          - name: texto
            label: "Texto de la franja"
            widget: text
            maxlength: 300
          - name: botonInstagram
            label: "Botón de Instagram"
            widget: string
            maxlength: 160
          - name: botonTiktok
            label: "Botón de TikTok"
            widget: string
            maxlength: 160
          - name: pieLogo
            label: "Logo del pie (texto)"
            widget: string
            maxlength: 160
          - name: pieDato
            label: "Frase del pie"
            widget: string
            maxlength: 160
            hint: "{zona} es la zona de «Datos de la tienda»."
          - name: pieWhatsapp
            label: "Link de WhatsApp"
            widget: string
            maxlength: 160
          - name: pieInstagram
            label: "Link de Instagram"
            widget: string
            maxlength: 160
          - name: pieTiktok
            label: "Link de TikTok"
            widget: string
            maxlength: 160
          - name: pieDerechos
            label: "Derechos"
            widget: string
            maxlength: 160
            hint: "{año} es el año actual y {tienda} el nombre de la tienda."
      - name: pedido
        label: "Pedido"
        file: /datos/textos/pedido.json
        format: json
        fields:
          - name: titulo
            label: "Título"
            widget: string
            maxlength: 160
            hint: "La hoja de «Tu pedido», la barra del celular y los avisos."
          - name: vacio
            label: "Pedido vacío"
            widget: string
            maxlength: 160
          - name: vacioNota
            label: "Ayuda del pedido vacío"
            widget: string
            maxlength: 160
          - name: irCatalogo
            label: "Botón del pedido vacío"
            widget: string
            maxlength: 160
          - name: prendaUna
            label: "Cantidad (una)"
            widget: string
            maxlength: 160
            hint: "{n} es el número."
          - name: prendasVarias
            label: "Cantidad (varias)"
            widget: string
            maxlength: 160
            hint: "{n} es el número."
          - name: barraBoton
            label: "Botón de la barra del celular"
            widget: string
            maxlength: 160
          - name: itemTalle
            label: "Talle de cada prenda"
            widget: string
            maxlength: 160
          - name: quitar
            label: "Botón quitar"
            widget: string
            maxlength: 160
          - name: quitado
            label: "Aviso al quitar"
            widget: string
            maxlength: 160
          - name: deshacer
            label: "Botón deshacer"
            widget: string
            maxlength: 160
          - name: nombre
            label: "Campo nombre"
            widget: string
            maxlength: 160
          - name: nombreEjemplo
            label: "Ejemplo del nombre"
            widget: string
            maxlength: 160
            hint: "Se ve en gris dentro del campo."
          - name: nombreError
            label: "Aviso si falta el nombre"
            widget: string
            maxlength: 160
          - name: entrega
            label: "Título de la entrega"
            widget: string
            maxlength: 160
          - name: zona
            label: "Campo localidad"
            widget: string
            maxlength: 160
            hint: "Aparece si eligen una entrega que pide dirección."
          - name: zonaEjemplo
            label: "Ejemplo de la localidad"
            widget: string
            maxlength: 160
          - name: pago
            label: "Campo de pago"
            widget: string
            maxlength: 160
          - name: total
            label: "Total"
